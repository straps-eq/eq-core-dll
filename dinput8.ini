; dinput8.ini - goes next to eqgame.exe with dinput8.dll. 1 = on, 0 = off (everything is off if missing).
; Results of each launch are written to dinput8.log in the same folder.
[Features]
SoloLDoN=0          ; LDoN adventures without a group (server must allow solo too)
NoDoubleDamage=0    ; stop the client applying melee hits to your HP twice (HP bounce, dying at half health)
MaxHPAbove10M=0     ; remove the client's 10,000,000 HP caps
AAPre51=0           ; AA window usable below level 51
AAPre51Inventory=0  ; also show AA exp on the inventory window below 51
IllegalAugments=0   ; allow augment combinations the player can't use
NoFoodDrinkSpam=0   ; no client hunger/thirst processing or messages
NoPatchme=0         ; start eqgame.exe without the patchme argument
ConNameTags=0       ; colour NPC name tags by con colour (not pets/mercs; refreshes on spawn/target change and after you level)

; Old-model horses need no patch on ToB: set AllowPreLuclinMountRiders=1 under [Defaults] in eqclient.ini
; (Options window: "Toggle Display of Pre-Luclin Characters on Mounts").
