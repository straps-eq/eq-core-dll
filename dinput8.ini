; dinput8.ini - goes next to eqgame.exe with dinput8.dll. 1 = on, 0 = off (a missing key uses the built-in default).
; Results of each launch are written to dinput8.log in the same folder.
[Features]
SoloLDoN=1          ; LDoN adventures without a group (server must allow solo too)
NoDoubleDamage=1    ; stop the client applying melee hits to your HP twice (HP bounce, dying at half health)
MaxHPAbove10M=1     ; remove the client's 10,000,000 HP caps
AAPre51=1           ; AA window usable below level 51
AAPre51Inventory=1  ; also show AA exp on the inventory window below 51
IllegalAugments=0   ; allow augment combinations the player can't use
NoFoodDrinkSpam=0   ; no client hunger/thirst processing or messages
NoPatchme=0         ; start eqgame.exe without the patchme argument
ConNameTags=1       ; colour NPC name tags by con colour (not pets/mercs; refreshes on spawn/target change and after you level)
MapSpawns=1         ; spawn dots and names on the map window, plus a line to your target (settings under [Map])
BuffTooltips=1      ; caster, effect summary and cure counters on buff/song/target buff tooltips (settings under [Buffs])
TargetDistance=1    ; line under the target's HP bar: level, race, class in con colour and the distance (settings under [TargetDistance])
Hud=1               ; fixed on-screen text: loc, zone, target, FPS, clock (settings under [Hud])
ItemDisplayExtras=1 ; item window: spell descriptions (when the window lacks them), ids, value, tribute, ratio, lore, levels, clicky cooldown, per-effect spell details (settings under [ItemDisplay])
SpellWindowExtras=1 ; spell window (buff right-click "Show Spell Information", spell links): description, id, times, range, effects in words, classes, category (settings under [SpellWindow])
FloatingCombatText=1 ; damage numbers rising from characters and NPCs in the 3D world, like Legends (settings under [FCT])

; MapSpawns settings (used only when MapSpawns=1). Colours are RRGGBB hex. Labels sit on map layer `Layer`,
; so the map's layer buttons and Z filter apply to them like to any other label.
[Map]
MaxLabels=100       ; nearest N spawns get a dot and a name (1-256)
MaxDistance=0       ; only spawns within this many units (0 = no limit)
LabelSize=3         ; font: 1 small, 2 medium, 3 large (the map's draw only knows these three)
Layer=3             ; map layer our labels belong to (0-3)
ShowLevel=0         ; append the level to the name (not for anonymous players)
ShowNPCs=1          ; NPCs in con colour
ShowPCs=1           ; other players
ShowGroup=1         ; your group members (own colour)
ShowPets=1
ShowMercs=1
ShowCorpses=1       ; 0 none, 1 player corpses, 2 all corpses
TargetLine=1        ; line from you to your target
ColourPC=FF00FF
ColourGroup=00FF00
ColourPet=FF8000
ColourMerc=E1B511
ColourPCCorpse=FFC0FF
ColourNPCCorpse=808080
ColourTargetLine=FF0000
ColourGreyCon=505050 ; grey-con NPCs (the Options grey is hard to read on the map)

; BuffTooltips settings (used only when BuffTooltips=1).
[Buffs]
MultiLine=1         ; 1 = one line per part (name/time, caster, effects, cures); 0 = everything on one line, " | " between parts
ShowCaster=1        ; "Caster: <name>" when the server sent one
ShowEffects=1       ; one line per effect in words ("Increase Hitpoints by 120 (L1) to 450 (L60) per tick")
ShowCures=1         ; "needs cure: 3 poison" for counter-carrying spells
MaxEffects=8        ; effects listed per spell (1-20)

; ItemDisplayExtras settings (used only when ItemDisplayExtras=1). Lines go below the item's own text: for each
; spell on the item its name and "Spell Effect: <description>", then the item block (Colour), then one
; "Spell Info for <Click|Proc|Worn|Focus|Scroll|Blessing> effect" block per spell (SpellInfoColour) with id,
; duration, recovery/recast, range, resist and one "Slot N:" line per effect in words.
[ItemDisplay]
ShowEffects=1       ; the spell name/description lines above and the "Spell Info" blocks below the item block
ShowIds=1           ; "Item ID" and "Icon ID"
ShowStackSize=1     ; "Stackable Count" for stackable items
ShowValue=1         ; "Value:" in pp/gp/sp/cp
ShowNoValue=0       ; also print "Value: none" for items without a price
ShowTribute=1       ; "Tribute Value" / "Guild Tribute Value"
ShowRatio=1         ; weapons: "Ratio" (delay/damage) and "Efficiency" (damage*100/delay)
ShowLore=1          ; "Item Lore:" text when it differs from the item name
ShowEffectLevels=1  ; "Procs at level N" / "Clickable at level N" (TooHighColour when above your level)
ShowLevels=1        ; "Required Level" / "Recommended Level"
ShowContainer=1     ; slots, item size held and weight reduction of bags
ShowCooldown=1      ; "Ready in:" while a clicky is cooling down
MaxEffects=12       ; "Slot N:" lines per spell (1-40)
Colour=00FFFF       ; item block colour (RRGGBB)
SpellNameColour=8AA3FF
SpellInfoColour=FF66FF
TooHighColour=FF4040

; SpellWindowExtras settings (used only when SpellWindowExtras=1). Added below the client's own text, in one
; colour block: "ID: n   Duration: d", "RecoveryTime: x   RecastTime: y", "Range: r", "Resist:" (detrimental),
; "Slot N: <effect>" lines, the classes with their levels, category, subcategory and spell icon.
[SpellWindow]
ShowDescription=1   ; "Spell Effect: <description>" when the client's own text does not already show it
ShowDetails=1       ; id, duration, recovery/recast, range, resist and the "Slot N:" effect lines
ShowClasses=1       ; "Warrior(1), Cleric(1), ..."
ShowCategory=1      ; category, subcategory and spell icon number
ShowCaster=0        ; repeat the caster line (the client prints one itself)
ShowMessages=0      ; cast on you / on other / wears off (the client prints them itself)
ShowDuplicates=0    ; repeat Duration, Range and Resist even when the client's own text already shows them
MaxEffects=20       ; "Slot N:" lines per spell (1-40)
Colour=00FFFF       ; block colour (RRGGBB)

; TargetDistance settings (used only when TargetDistance=1). One line drawn as part of the Target window (windows
; on top of it cover it): "<level> <race> <class>" in the target's con colour at ConOffsetX from the left edge
; of the window's client area, the distance (Colour) right-aligned at OffsetX from its right edge. The row starts
; OffsetY below the client area's top and, with AutoPlace=1, moves down past the HP gauge and its labels. Font
; is the UI font index (2 = the client's own on-screen text font).
[TargetDistance]
Colour=F0F0F0
Font=2
OffsetX=-2
OffsetY=2
AutoPlace=1
ConLine=1
ConOffsetX=2

; Hud settings (used only when Hud=1). X/Y is the top-left corner of the block in screen pixels; each line
; can be turned off. Loc is Y, X, Z like /loc; Zone is the long zone name; Target is name and distance.
[Hud]
X=10
Y=10
Colour=F0F0F0
Font=2
Loc=1
Zone=1
Target=1
FPS=1
Clock=1

; FloatingCombatText settings (used only when FloatingCombatText=1). Numbers come from the OP_Damage packets the
; server already sends. Categories: You = your hits and your pet's, Self = hits on you, Other = everyone else's hits
; (only within OtherRange of you, as the chat window shows them). Per category: on/off, Text (0 off, 1 numbers
; only, 2 numbers plus the words Miss, Block, Parry, Riposte, Dodge, Invulnerable, Absorb), Scale (font: 2 x Scale
; rounded, so 1.0 = the Hud's font 2 and each +0.5 is one size larger, capped at the largest UI font) and Colour
; (RRGGBB; empty = the client's own chat colour for that hit message, Options > Colors). Crits use CritScale and
; CritColour. Animation as in Legends: each number starts at the spawn's head (HeadHeight x the spawn's size above
; its position), flies off at a random angle between MinAngle and MaxAngle degrees (0 = right, 90 = up) at a speed
; between MinVelocity and MaxVelocity, falls with Gravity (speeds and gravity are x PixelsPerUnit pixels), lives
; LifeMs and fades out over the last FadeMs. At most MaxEntries numbers at once (oldest dropped). The server sends
; a pet owner each pet hit twice; the copy within DedupMs is dropped.
[FCT]
Show=1              ; numbers on (1) or off (0); ToggleKey flips it in game and saves it here
ToggleKey=Ctrl+Shift+F ; modifiers (Ctrl, Shift, Alt) plus A-Z, 0-9 or F1-F24; none = no hotkey
You=1
YouText=2
YouScale=1.25
YouColour=
Self=1
SelfText=2
SelfScale=1.25
SelfColour=
Other=1
OtherText=2
OtherScale=1.0
OtherColour=
CritScale=1.75
CritColour=FFE040
MinVelocity=2.0
MaxVelocity=4.0
Gravity=2.5
MinAngle=75
MaxAngle=250
PixelsPerUnit=30
LifeMs=2500
FadeMs=500
HeadHeight=1.0
OtherRange=200
MaxEntries=32
DedupMs=100
Outline=1           ; 1 px black outline behind each number

; Old-model horses need no patch on ToB: set AllowPreLuclinMountRiders=1 under [Defaults] in eqclient.ini
; (Options window: "Toggle Display of Pre-Luclin Characters on Mounts").

; Diagnostics. CrashLog writes the first few access violations (module+offset and call stack) to dinput8.log.
[Debug]
CrashLog=1
