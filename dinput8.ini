; dinput8.ini - goes next to eqgame.exe with dinput8.dll. 1 = on, 0 = off (everything is off if missing).
; Results of each launch are written to dinput8.log in the same folder.
[Features]
SoloLDoN=0          ; LDoN adventures without a group (server must allow solo too)
NoDoubleDamage=0    ; stop the client applying melee hits to your HP twice (HP bounce, dying at half health)
MaxHPAbove10M=0     ; remove the client's 10,000,000 HP caps
AAPre51=0           ; AA window usable below level 51
AAPre51Inventory=0  ; also show AA exp on the inventory window below 51
IllegalAugments=0   ; allow augment combinations the player can't use
NoFoodDrinkSpam=0   ; no client hunger/thirst processing or messages
NoPatchme=0         ; start eqgame.exe without the patchme argument
ConNameTags=0       ; colour NPC name tags by con colour (not pets/mercs; refreshes on spawn/target change and after you level)
MapSpawns=0         ; spawn dots and names on the map window, plus a line to your target (settings under [Map])
TargetDistance=0    ; distance to your target drawn in the Target window (settings under [TargetDistance])
Hud=0               ; fixed on-screen text: loc, zone, target, FPS, clock (settings under [Hud])

; MapSpawns settings (used only when MapSpawns=1). Colours are RRGGBB hex. Labels sit on map layer `Layer`,
; so the map's layer buttons and Z filter apply to them like to any other label.
[Map]
MaxLabels=100       ; nearest N spawns get a dot and a name (1-256)
MaxDistance=0       ; only spawns within this many units (0 = no limit)
LabelSize=1         ; font: 1 small, 2 medium, 3 large
Layer=3             ; map layer our labels belong to (0-3)
ShowLevel=1         ; append the level to the name (not for anonymous players)
ShowNPCs=1          ; NPCs in con colour
ShowPCs=1           ; other players
ShowGroup=1         ; your group members (own colour)
ShowPets=1
ShowMercs=1
ShowCorpses=1       ; 0 none, 1 player corpses, 2 all corpses
TargetLine=1        ; line from you to your target
ColourPC=FF00FF
ColourGroup=00FF00
ColourPet=FF8000
ColourMerc=E1B511
ColourPCCorpse=FFC0FF
ColourNPCCorpse=808080
ColourTargetLine=FF0000

; TargetDistance settings (used only when TargetDistance=1). Text is right-aligned to the Target window's
; right edge; offsets move it (OffsetY from the window's top edge). Font is the UI font index (2 = the
; client's own on-screen text font).
[TargetDistance]
Colour=F0F0F0
Font=2
OffsetX=-4
OffsetY=2

; Hud settings (used only when Hud=1). X/Y is the top-left corner of the block in screen pixels; each line
; can be turned off. Loc is Y, X, Z like /loc; Zone is the long zone name; Target is name and distance.
[Hud]
X=10
Y=10
Colour=F0F0F0
Font=2
Loc=1
Zone=1
Target=1
FPS=1
Clock=1

; Old-model horses need no patch on ToB: set AllowPreLuclinMountRiders=1 under [Defaults] in eqclient.ini
; (Options window: "Toggle Display of Pre-Luclin Characters on Mounts").
